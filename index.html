<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新番导视</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 新增控制栏样式 */
        header { display: flex; flex-direction: column; gap: 15px; }
        header h1 { margin: 0; }
        header .header-bottom { display: flex; flex-direction: column; gap: 15px; }
        .controls { display: flex; width: 100%; flex-direction: column; gap: 15px; padding: 20px; background: var(--card); border-radius: 12px; }
        .controls > div { text-align: left; }
        .controls strong { display: block; margin-bottom: 8px; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
        .filter-btn { padding: 6px 14px; border: none; background: #334155; color: #94a3b8; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: var(--accent); color: var(--bg); font-weight: bold; }
        .sort-group { display: flex; align-self: flex-end; background: var(--card); padding: 15px 20px; border-radius: 12px; }
        .sort-group select { padding: 8px; background: var(--card); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer; }
        .summary { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; word-wrap: break-word; max-height: 3em; }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            header { gap: 12px; }
            header h1 { font-size: 1.8rem; }
            header .header-bottom { flex-direction: column; gap: 12px; }
            .controls { gap: 12px; padding: 15px; }
            .controls > div { margin-bottom: 0; }
            .controls strong { margin-bottom: 6px; font-size: 0.95rem; }
            .filter-group { gap: 6px; overflow-x: auto; padding-bottom: 8px; }
            .filter-group::-webkit-scrollbar { height: 0; }
            .filter-group::-webkit-scrollbar-thumb { background: transparent; }
            .filter-btn { padding: 5px 10px; font-size: 0.85rem; white-space: nowrap; flex-shrink: 0; }
            .sort-group select { padding: 6px; font-size: 0.9rem; }
        }
        
        @media (max-width: 480px) {
            body { padding: 1rem; }
            header h1 { font-size: 1.5rem; }
            .controls { gap: 10px; padding: 12px; }
            .controls strong { font-size: 0.9rem; }
            .filter-btn { padding: 4px 8px; font-size: 0.8rem; }
            .filter-group { gap: 5px; }
            .sort-group select { width: 100%; padding: 6px; font-size: 0.85rem; }
        }

        /* 视图切换（当季 / 往期） */
        .view { display: none; }
        .view.active { display: block; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
        .back-btn span { font-size: 18px; line-height: 1; }

        .archive-list {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }
        .archive-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid #334155;
            cursor: pointer;
            transition: 0.2s;
        }
        .archive-item:hover { border-color: var(--accent); transform: translateY(-1px); }
        .archive-item .meta { color: #94a3b8; font-size: 0.95rem; }
        .card { cursor: pointer; }

        .detail-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }
        .detail-modal.open {
            display: flex;
            animation: detail-fade-in 0.2s ease;
        }
        @keyframes detail-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .detail-modal-panel {
            width: min(960px, 100%);
            max-height: min(86vh, 900px);
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--card);
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .detail-modal-panel::-webkit-scrollbar {
            display: none;
        }
        .detail-modal-inner {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 28px;
            padding: 28px 28px 32px;
        }
        .detail-poster {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg);
            border: 1px solid #334155;
            align-self: start;
            position: sticky;
            top: 0;
        }
        .detail-poster img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .detail-body {
            min-width: 0;
        }
        .detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #334155;
        }
        .detail-title {
            margin: 0;
            font-size: clamp(22px, 2.5vw, 30px);
            line-height: 1.35;
            color: var(--accent);
        }
        .detail-subtitle {
            margin: 6px 0 0;
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .detail-close {
            border: none;
            background: #334155;
            color: #94a3b8;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .detail-close:hover {
            background: var(--accent);
            color: var(--bg);
        }
        .detail-stat-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .detail-stat {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--bg);
            border: 1px solid #334155;
            font-size: 0.95rem;
        }
        .detail-stat .detail-label {
            display: inline;
            margin: 0;
            font-size: 0.85rem;
        }
        .detail-stat .detail-value {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .detail-meta-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 20px;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
        }
        .detail-meta-item {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 12px;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #334155;
            border-radius: 0;
        }
        .detail-meta-item:last-child {
            border-bottom: none;
        }
        .detail-label {
            display: block;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 0;
            flex-shrink: 0;
        }
        .detail-value {
            color: #e2e8f0;
            font-size: 0.95rem;
            word-break: break-word;
            line-height: 1.5;
        }
        .detail-value a {
            color: #93c5fd;
            text-decoration: none;
        }
        .detail-value a:hover {
            text-decoration: underline;
        }
        .detail-section {
            margin-bottom: 20px;
        }
        .detail-section h3 {
            margin: 0 0 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .detail-summary {
            margin: 0;
            color: #cbd5e1;
            line-height: 1.75;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .detail-tags,
        .detail-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .detail-links a {
            color: var(--text);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid #334155;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .detail-links a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        body.modal-open { overflow: hidden; }

        @media (max-width: 900px) {
            .detail-modal { padding: 12px; }
            .detail-modal-inner {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            .detail-poster {
                max-width: 200px;
                margin: 0 auto;
                position: static;
            }
        }

        @media (max-width: 560px) {
            .detail-meta-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="topbar">
                <button id="back-to-archive" class="back-btn" title="返回往期列表" style="visibility:hidden;">
                    <span>←</span>
                </button>
                <div style="font-size: 0.85rem; color: #888; margin: 0;">
                    数据源：<a href="https://bgm.tv" target="_blank" style="color: #888; text-decoration: none;">Bangumi 番组计划</a>
                    | 最新更新：<span id="data-update-time" style="color: #aaa;">加载中...</span>
                </div>
                <div style="width:40px;"></div>
            </div>
            <h1 id="page-title">新番导视</h1>
        </header>

        <!-- 视图 A：当季导视 -->
        <div id="season-view" class="view active">
            <div class="header-bottom" style="display:flex; flex-direction: column; gap: 15px;">
                <div class="controls">
                    <div>
                        <strong>出处筛选</strong>
                        <div class="filter-group" id="origin-filter">
                            <button class="filter-btn active" data-filter="all">全部</button>
                        </div>
                    </div>
                    <div>
                        <strong>标签筛选</strong>
                        <div class="filter-group" id="tag-filter">
                            <button class="filter-btn active" data-filter="all">全部</button>
                        </div>
                    </div>
                </div>
                <div class="sort-group">
                    <select id="sort-select">
                        <option value="wish">按关注度 (想看人数)</option>
                        <option value="score">按评分排序</option>
                    </select>
                </div>
            </div>

            <main class="anime-grid" id="anime-grid">
                <!-- 动态加载的卡片内容 -->
            </main>
        </div>

        <!-- 视图 B：往期列表 -->
        <div id="archive-view" class="view">
            <div style="text-align:left; color:#94a3b8;">
                选择季度进入对应的新番导视（默认进入最新一季）。
            </div>
            <div id="archive-list" class="archive-list"></div>
        </div>
    </div>

    <div id="detail-modal" class="detail-modal" aria-hidden="true">
        <div class="detail-modal-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <div id="detail-modal-content"></div>
        </div>
    </div>

    <script>
        let allAnimeData = [];
        let currentRenderedAnime = [];
        let selectedOrigin = 'all';
        let selectedTag = 'all';
        let seasonsIndex = null;
        let currentSeasonKey = null;
        const seasonMetaCache = new Map(); // seasonKey -> { lastUpdated }

        function setView(view) {
            const seasonView = document.getElementById('season-view');
            const archiveView = document.getElementById('archive-view');
            const backBtn = document.getElementById('back-to-archive');

            if (view === 'archive') {
                seasonView.classList.remove('active');
                archiveView.classList.add('active');
                backBtn.style.visibility = 'hidden';
                document.getElementById('page-title').textContent = '往期列表';
                document.title = '往期列表';
            } else {
                archiveView.classList.remove('active');
                seasonView.classList.add('active');
                backBtn.style.visibility = 'visible';
            }
        }

        function pad2(n) { return String(n).padStart(2, '0'); }

        function formatSeasonTitle(seasonKey) {
            const m = String(seasonKey || '').match(/^(\d{4})-(\d{2})$/);
            if (!m) return '新番导视';
            const year = m[1];
            const month = String(Number(m[2]));
            return `${year} 年 ${month} 月 新番导视`;
        }

        function formatValue(value, fallback = '未知') {
            if (value === null || value === undefined || value === '') return fallback;
            return value;
        }

        function getAnimeLinks(anime, titleCn, titleOrigin) {
            return {
                bangumiUrl: anime.id ? `https://bgm.tv/subject/${anime.id}` : '',
                pvUrl: `https://www.youtube.com/results?search_query=${encodeURIComponent(anime.pvSearchKeywords || titleOrigin || titleCn)}`
            };
        }

        function openDetailModal(anime) {
            if (!anime) return;

            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-modal-content');
            const titleCn = anime.title || anime.originTitle || '未知标题';
            const titleOrigin = anime.originTitle || '';
            const allTags = [];
            if (anime.origin) allTags.push(anime.origin);
            if (anime.metaTags && anime.metaTags.length) allTags.push(...anime.metaTags);
            const uniqueTags = Array.from(new Set(allTags.filter(Boolean)));
            const { bangumiUrl, pvUrl } = getAnimeLinks(anime, titleCn, titleOrigin);

            content.innerHTML = `
                <div class="detail-modal-inner">
                    <div class="detail-poster">
                        <img src="${anime.cover || ''}" alt="${titleCn}">
                    </div>
                    <div class="detail-body">
                        <div class="detail-header">
                            <div>
                                <h2 id="detail-title" class="detail-title">${titleCn}</h2>
                                ${titleOrigin ? `<p class="detail-subtitle">${titleOrigin}</p>` : ''}
                            </div>
                            <button id="detail-close-btn" class="detail-close" type="button" aria-label="关闭详情">×</button>
                        </div>

                        <div class="detail-stat-grid">
                            <div class="detail-stat">
                                <span class="detail-label">Bangumi 评分</span>
                                <span class="detail-value">★ ${formatValue(anime.score, 0)}</span>
                            </div>
                            <div class="detail-stat">
                                <span class="detail-label">想看人数</span>
                                <span class="detail-value">${formatValue(anime.wish, 0)} 人</span>
                            </div>
                        </div>

                        <div class="detail-meta-grid">
                            <div class="detail-meta-item"><span class="detail-label">放送日期</span><span class="detail-value">${formatValue(anime.airDate)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">放送星期</span><span class="detail-value">${formatValue(anime.broadcast)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">话数</span><span class="detail-value">${formatValue(anime.episodes)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">出处</span><span class="detail-value">${formatValue(anime.origin)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">监督</span><span class="detail-value">${formatValue(anime.director)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">制作</span><span class="detail-value">${formatValue(anime.studio)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">系列构成 / 脚本</span><span class="detail-value">${formatValue(anime.script)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">角色设计</span><span class="detail-value">${formatValue(anime.charDesign)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">音乐</span><span class="detail-value">${formatValue(anime.music)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">主题歌演出</span><span class="detail-value">${formatValue(anime.aniSongPerformers)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">原作</span><span class="detail-value">${formatValue(anime.originInfo)}</span></div>
                            <div class="detail-meta-item"><span class="detail-label">官网</span><span class="detail-value">${anime.officialSite ? `<a href="${anime.officialSite}" target="_blank" rel="noopener noreferrer">${anime.officialSite}</a>` : '未知'}</span></div>
                        </div>

                        <div class="detail-section">
                            <h3>简介</h3>
                            <p class="detail-summary">${formatValue(anime.summary, '暂无简介')}</p>
                        </div>

                        <div class="detail-section">
                            <h3>标签</h3>
                            <div class="detail-tags">
                                ${uniqueTags.length ? uniqueTags.map(tag => `<span class="tag meta-tag">${tag}</span>`).join('') : '<span class="detail-value">暂无标签</span>'}
                            </div>
                        </div>

                        <div class="detail-section">
                            <h3>相关链接</h3>
                            <div class="detail-links">
                                <a href="${pvUrl}" target="_blank" rel="noopener noreferrer">搜索 PV</a>
                                ${anime.officialSite ? `<a href="${anime.officialSite}" target="_blank" rel="noopener noreferrer">官方网站</a>` : ''}
                                ${bangumiUrl ? `<a href="${bangumiUrl}" target="_blank" rel="noopener noreferrer">Bangumi 页面</a>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
            document.getElementById('detail-close-btn').addEventListener('click', closeDetailModal);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-modal-content');
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
            content.innerHTML = '';
            document.body.classList.remove('modal-open');
        }

        function withCacheBust(url) {
            const joiner = url.includes('?') ? '&' : '?';
            return `${url}${joiner}t=${Date.now()}`;
        }

        async function loadLibrary() {
            const res = await fetch(withCacheBust('./data/library.json'), { cache: 'no-store' });
            if (!res.ok) throw new Error('library.json 加载失败');
            return await res.json();
        }

        async function loadSeason(seasonKey) {
            const res = await fetch(withCacheBust(`./data/seasons/${seasonKey}.json`), { cache: 'no-store' });
            if (!res.ok) throw new Error(`season 数据加载失败: ${seasonKey}`);
            return await res.json();
        }

        function resetFiltersUI() {
            selectedOrigin = 'all';
            selectedTag = 'all';
            document.getElementById('origin-filter').innerHTML = '<button class="filter-btn active" data-filter="all">全部</button>';
            document.getElementById('tag-filter').innerHTML = '<button class="filter-btn active" data-filter="all">全部</button>';
        }

        async function getSeasonMeta(seasonKey) {
            if (seasonMetaCache.has(seasonKey)) return seasonMetaCache.get(seasonKey);
            try {
                const seasonJson = await loadSeason(seasonKey);
                const meta = { lastUpdated: seasonJson.lastUpdated || '未知' };
                seasonMetaCache.set(seasonKey, meta);
                return meta;
            } catch (e) {
                const meta = { lastUpdated: '未知' };
                seasonMetaCache.set(seasonKey, meta);
                return meta;
            }
        }

        async function renderArchiveList() {
            seasonMetaCache.clear();
            const list = document.getElementById('archive-list');
            const seasons = Array.isArray(seasonsIndex?.seasons) ? seasonsIndex.seasons.slice() : [];
            const counts = seasonsIndex?.counts || {};
            seasons.sort().reverse();

            list.innerHTML = '<div style="color:#94a3b8;">加载往期列表中...</div>';

            const metas = await Promise.all(seasons.map(async (s) => {
                const meta = await getSeasonMeta(s);
                return [s, meta];
            }));
            const metaBySeason = Object.fromEntries(metas);

            list.innerHTML = seasons.map(s => {
                const count = counts[s] ?? '-';
                const title = formatSeasonTitle(s);
                const lastUpdated = metaBySeason[s]?.lastUpdated || '未知';
                return `
                    <div class="archive-item" data-season="${s}">
                        <div>
                            <div style="font-weight:600; color: var(--text);">${title}</div>
                            <div class="meta">最后更新：${lastUpdated}</div>
                        </div>
                        <div class="meta">${count} 部 →</div>
                    </div>
                `;
            }).join('');

            list.querySelectorAll('.archive-item').forEach(el => {
                el.addEventListener('click', async () => {
                    const season = el.dataset.season;
                    if (!season) return;
                    await showSeason(season);
                });
            });
        }

        async function showSeason(seasonKey) {
            currentSeasonKey = seasonKey;
            const seasonJson = await loadSeason(seasonKey);

            const data = Array.isArray(seasonJson.items) ? seasonJson.items : [];
            const lastUpdated = seasonJson.lastUpdated || '未知';

            document.getElementById('data-update-time').textContent = lastUpdated;
            document.getElementById('page-title').textContent = formatSeasonTitle(seasonKey);
            document.title = formatSeasonTitle(seasonKey);

            // 过滤数据：不包含 "剧场版"
            allAnimeData = data.filter(anime => {
                const hasExcludedTag = anime.metaTags && anime.metaTags.some(tag => String(tag).includes('剧场版'));
                return !hasExcludedTag;
            });

            resetFiltersUI();
            generateFilterButtons();
            renderCards();
            attachFilterListeners();
            attachSortListener();
            performSort();

            setView('season');
        }

        // 从 JSON 加载数据并初始化（默认：当季）
        async function loadData() {
            try {
                seasonsIndex = await loadLibrary();

                // 绑定返回按钮（回到往期列表）
                document.getElementById('back-to-archive').addEventListener('click', () => {
                    renderArchiveList();
                    setView('archive');
                });

                const seasons = Array.isArray(seasonsIndex.seasons) ? seasonsIndex.seasons.slice() : [];
                seasons.sort().reverse();
                const latest = seasons[0];
                if (!latest) throw new Error('library.json 中没有 seasons');

                await showSeason(latest);
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('anime-grid').innerHTML = '<p style="text-align: center; color: var(--text);">数据加载失败，请稍后重试</p>';
            }
        }

        // 提取并生成筛选按钮
        function generateFilterButtons() {
            const origins = new Set();
            const tags = new Set();
            
            allAnimeData.forEach(anime => {
                if (anime.origin) origins.add(anime.origin);
                if (anime.metaTags) anime.metaTags.forEach(tag => tags.add(tag));
            });

            
            // 添加出处按钮
            const originFilter = document.getElementById('origin-filter');
            const originBtns = Array.from(origins);

            originBtns.forEach(origin => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = origin;
                btn.textContent = origin;
                originFilter.appendChild(btn);
            });
            
            // 添加标签按钮
            const tagFilter = document.getElementById('tag-filter');
            const displayTags = Array.from(new Set([...origins,...tags]));
            const tagBtns = Array.from(tags);
            tagBtns.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = tag;
                btn.textContent = tag;
                tagFilter.appendChild(btn);
            });
        }

        // 渲染卡片
        function renderCards(filtered = null) {
            const grid = document.getElementById('anime-grid');
            const dataToRender = filtered || allAnimeData;
            currentRenderedAnime = dataToRender;
            
            grid.innerHTML = dataToRender.map((anime, index) => {
                // 合并 origin 和 metaTags，生成用于筛选的数据属性
                const allTags = [];
                if (anime.origin) allTags.push(anime.origin);
                if (anime.metaTags && anime.metaTags.length) allTags.push(...anime.metaTags);
                const uniqueTags = Array.from(new Set(allTags.filter(t => t)));

                const titleCn = anime.title || '';
                const titleOrigin = anime.originTitle || '';
                const { bangumiUrl, pvUrl } = getAnimeLinks(anime, titleCn, titleOrigin);
                
                return `
                <div class="card"
                     data-anime-index="${index}"
                     data-wish="${anime.wish || 0}" 
                     data-score="${anime.score || 0}"
                     data-origin="${anime.origin || ''}"
                     data-tags="${uniqueTags.join('|')}">
                    
                    <div class="poster-wrapper">
                        <img class="poster" src="${anime.cover || ''}" loading="lazy" alt="${titleCn}">
                        <div class="score-badge">★ ${anime.score || 0}</div>
                    </div>

                    <div class="info">
                        <h3 class="title" title="${titleCn}">
                            <span class="title-cn">${titleCn}</span>
                            ${titleOrigin ? `<span class="title-jp">${titleOrigin}</span>` : ''}
                        </h3>
                        
                        <div class="meta">
                            <span>📅 ${anime.airDate || ''}</span>
                            <span>🔥 ${anime.wish || 0} 人想看</span>
                        </div>

                        <div class="staff-info">
                            ${anime.director ? `<p><strong>监督:</strong> ${anime.director}</p>` : ''}
                            ${anime.studio ? `<p><strong>制作:</strong> ${anime.studio}</p>` : ''}
                        </div>

                            <p class="summary" title="${anime.summary || ''}">${anime.summary || ''}</p>                       
                             <div class="tags">
                            ${uniqueTags.map(tag => `<span class="tag meta-tag">${tag}</span>`).join('')}
                        </div>
                        
                        <div class="resource-links">
                            <a href="${pvUrl}" target="_blank" rel="noopener noreferrer" title="搜索 PV">🎬 PV</a>
                            ${anime.officialSite ? `<a href="${anime.officialSite}" target="_blank" rel="noopener noreferrer" title="官方网站">🌐 官网</a>` : ''}
                            ${bangumiUrl ? `<a href="${bangumiUrl}" target="_blank" rel="noopener noreferrer" title="Bangumi 页面">📺 Bangumi</a>` : ''}
                        </div>
                    </div>
                </div>
            `}).join('');

            grid.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => {
                    const animeIndex = Number(card.dataset.animeIndex);
                    openDetailModal(currentRenderedAnime[animeIndex]);
                });
            });

            grid.querySelectorAll('.card a').forEach(link => {
                link.addEventListener('click', (event) => {
                    event.stopPropagation();
                });
            });
        }

        // 过滤逻辑
        function applyFilters() {
            const filtered = allAnimeData.filter(anime => {
                const matchOrigin = selectedOrigin === 'all' || anime.origin === selectedOrigin;
                const matchTag = selectedTag === 'all' || (anime.metaTags && anime.metaTags.includes(selectedTag));
                return matchOrigin && matchTag;
            });
            
            renderCards(filtered);
            performSort();
        }

        // 排序逻辑
        function performSort() {
            const sortSelect = document.getElementById('sort-select');
            const sortBy = sortSelect.value;
            const cards = document.querySelectorAll('.card');
            const cardsArray = Array.from(cards);
            
            cardsArray.sort((a, b) => {
                const valA = parseFloat(a.dataset[sortBy]) || 0;
                const valB = parseFloat(b.dataset[sortBy]) || 0;
                return valB - valA;
            });
            
            const grid = document.getElementById('anime-grid');
            cardsArray.forEach(card => grid.appendChild(card));
        }

        // 绑定筛选事件
        function attachFilterListeners() {
            const originFilterBtns = document.querySelectorAll('#origin-filter .filter-btn');
            const tagFilterBtns = document.querySelectorAll('#tag-filter .filter-btn');
            
            originFilterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    originFilterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedOrigin = btn.dataset.filter;
                    applyFilters();
                });
            });
            
            tagFilterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tagFilterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedTag = btn.dataset.filter;
                    applyFilters();
                });
            });
        }

        // 绑定排序事件
        function attachSortListener() {
            const sortSelect = document.getElementById('sort-select');
            performSort();
            sortSelect.addEventListener('change', performSort);
        }

        function bindModalEvents() {
            const modal = document.getElementById('detail-modal');
            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    closeDetailModal();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modal.classList.contains('open')) {
                    closeDetailModal();
                }
            });
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', () => {
            bindModalEvents();
            loadData();
        });
    </script>
</body>
</html>
